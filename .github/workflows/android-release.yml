name: Android Release APK

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_release_apk:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission to Gradle wrapper
        run: chmod +x ./gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --build-cache --parallel -x lint -x test

      - name: Read app version
        id: app_version
        shell: bash
        run: |
          VERSION_NAME=$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' app/build.gradle | head -n 1)
          VERSION_CODE=$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\([0-9][0-9]*\).*/\1/p' app/build.gradle | head -n 1)
          VERSION_NAME=${VERSION_NAME:-unknown}
          VERSION_CODE=${VERSION_CODE:-unknown}
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "App version: ${VERSION_NAME} (${VERSION_CODE})"

      - name: Rename release APK
        id: apk
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' | head -n 1)
          if [ -z "$APK" ]; then
            echo 'No release APK was produced.' >&2
            exit 1
          fi

          APK_NAME="Kiduyu-Ebook-Studio-release-${{ steps.app_version.outputs.version_name }}-build${{ steps.app_version.outputs.version_code }}.apk"
          APK_PATH="app/build/outputs/apk/release/${APK_NAME}"
          mv "$APK" "$APK_PATH"
          echo "path=${APK_PATH}" >> "$GITHUB_OUTPUT"
          echo "Created ${APK_PATH}"

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kiduyu-ebook-studio-release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 30
